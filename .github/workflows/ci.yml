name: Savora Backend CI

on:
  push:
    branches: [main, sude, sude-mobile-frontend]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Bağımlılıkları yükle
        working-directory: backend
        run: npm ci

      - name: Sözdizimi kontrolü (Syntax Check)
        working-directory: backend
        run: |
          node --input-type=module --check < src/server.js || true
          echo "Sözdizimi kontrolü tamamlandı"

      - name: Backend dosyaları mevcut mu kontrol et
        working-directory: backend
        run: |
          echo "=== Backend Yapısı ==="
          ls src/
          echo "=== Kontroller ==="
          test -f src/server.js && echo "✅ server.js mevcut"
          test -f src/app.js && echo "✅ app.js mevcut"
          test -f src/models/productModel.js && echo "✅ productModel.js mevcut"
          test -f src/controllers/productController.js && echo "✅ productController.js mevcut"
          test -f src/routes/productRoutes.js && echo "✅ productRoutes.js mevcut"
          echo "=== CI başarıyla tamamlandı ==="
