version: '3.8'

services:
  # ─── Backend (REST API) ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: savora-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - RABBITMQ_URL=amqp://savora:savora123@rabbitmq:5672
      - REDIS_URL=redis://redis:6379
    depends_on:
      - rabbitmq
      - redis
    restart: unless-stopped
    networks:
      - savora-network

  # ─── Frontend (React + Nginx) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: savora-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - savora-network

  # ─── RabbitMQ ───────────────────────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: savora-rabbitmq
    ports:
      - "5672:5672"     # AMQP protokolü
      - "15672:15672"   # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: savora
      RABBITMQ_DEFAULT_PASS: savora123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - savora-network

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: savora-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - savora-network

networks:
  savora-network:
    driver: bridge

volumes:
  rabbitmq_data:
  redis_data:
