openapi: 3.0.3
info:
  title: Savora Ev Yemekleri ve Sipariş Yönetim API'si
  version: 1.0.0
  description: >
    Bu API, Savora platformundaki ev yemeği ilanlarının, kullanıcı siparişlerinin ve ödeme süreçlerinin yönetilmesi için tasarlanmış bir RESTful servistir.
  contact:
    name: Alara Kökbudak
    email: alarakokbudak@sdu.edu.tr

servers:
  - url: http://localhost:5000
    description: Yerel geliştirme sunucusu (Development)

tags:
  - name: Yemekler
    description: Yemek ilanı oluşturma ve listeleme işlemleri
  - name: Siparişler
    description: Sipariş oluşturma ve ödeme işlemleri

security:
  - BearerAuth: []

paths:
  /api/meals:
    get:
      tags:
        - Yemekler
      summary: Tüm Yemek İlanlarını Listele
      responses:
        "200":
          description: Yemekler başarıyla listelendi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Meal'
    post:
      tags:
        - Yemekler
      summary: Yeni Yemek İlanı Ekle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MealInput'
      responses:
        "201":
          description: Yemek ilanı başarıyla oluşturuldu
        "401":
          description: Kimlik doğrulama başarısız

  /api/meals/{mealid}:
    parameters:
      - name: mealid
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - Yemekler
      summary: Yemek Detayını Getir
      responses:
        "200":
          description: Başarılı
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Meal'
        "404":
          description: Yemek bulunamadı

  /api/orders:
    post:
      tags:
        - Siparişler
      summary: Yeni Sipariş ve Ödeme Oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderInput'
      responses:
        "201":
          description: Sipariş başarıyla tamamlandı
        "400":
          description: Geçersiz sipariş verisi

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Meal:
      type: object
      required:
        - name
        - price
      properties:
        _id:
          type: string
        name:
          type: string
          example: "Anne Köftesi"
        price:
          type: number
          example: 120.50
        description:
          type: string
          example: "Taze malzemelerle hazırlanmıştır."

    MealInput:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
          minLength: 2
        price:
          type: number
          minimum: 1
        description:
          type: string

    OrderInput:
      type: object
      required:
        - mealId
        - quantity
      properties:
        mealId:
          type: string
        quantity:
          type: integer
          minimum: 1
        deliveryAddress:
          type: string

    Error:
      type: object
      properties:
        message:
          type: string