<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Savora - Yönetim Paneli</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background-color: #f0f2f5;
        }

        .card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            max-width: 500px;
        }

        h3 {
            margin-top: 0;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            margin-top: 5px;
        }

        .btn-post {
            background-color: #28a745;
        }

        .btn-get {
            background-color: #007bff;
        }

        .btn-put {
            background-color: #ffc107;
            color: black;
        }

        .btn-delete {
            background-color: #dc3545;
        }

        pre {
            background: #eee;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <h1>Savora Full-Stack Test Paneli</h1>

    <div class="card">
        <h3>1. Özel Yemek Talebi Aç (POST)</h3>
        <input type="text" id="isim" placeholder="Ad Soyad">
        <input type="text" id="yemek" placeholder="Yemek İsmi">
        <input type="text" id="not" placeholder="Özel Not">
        <button class="btn-post" onclick="talepGonder()">Talebi Gönder</button>
    </div>

    <div class="card">
        <h3>2. Yemeğe Yorum Yap (POST)</h3>
        <input type="text" id="yorumIsim" placeholder="Ad Soyad">
        <input type="text" id="yorumMetni" placeholder="Yorumunuz">
        <input type="number" id="puan" placeholder="Puan (1-5)" min="1" max="5">
        <button class="btn-post" onclick="yorumYap()">Yorumu Kaydet</button>
    </div>

    <div class="card">
        <h3>3. Tüm Yorumları Gör (GET)</h3>
        <button class="btn-get" onclick="yorumlariListele()">Listele</button>
        <pre id="yorumListesi">Yorumlar burada görünecek...</pre>
    </div>

    <div class="card">
        <h3>4. Talebi Güncelle (PUT)</h3>
        <input type="number" id="guncelleId" placeholder="Talep ID (Örn: 1)">
        <input type="text" id="yeniNot" placeholder="Yeni Özel Not">
        <button class="btn-put" onclick="talepGuncelle()">Güncelle</button>
    </div>

    <div class="card">
        <h3>5. Taleplerimi Bul (GET)</h3>
        <input type="text" id="filtreIsim" placeholder="Aranacak İsim">
        <button class="btn-get" onclick="taleplerimFiltrele()">Filtrele</button>
        <pre id="filtreSonuc">Sonuçlar burada görünecek...</pre>
    </div>

    <div class="card">
        <h3>6. Talebi İptal Et (DELETE)</h3>
        <input type="number" id="iptalId" placeholder="İptal Edilecek ID">
        <button class="btn-delete" onclick="talepIptal()">Talebi Sil</button>
    </div>

    <script src="script.js"></script>
</body>

</html>
